<style>
:root{--petrol:#007088;--petrol-d:#00566a;--carmim:#B02040;--ink:#232323;--muted:#7c7c7c;--line:#ececec;--teal-bg:#E3F4EF;--teal-line:#a9e0cd;--teal-ink:#0d6b52;--carmim-bg:#fbe9ee;--carmim-line:#eec6d1;}
*{box-sizing:border-box}
body{margin:0;background:#eef1f2;font-family:'Raleway',system-ui,Arial,sans-serif;color:var(--ink)}
.app{max-width:460px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06)}
.badge-pilot{position:static;z-index:5;background:var(--carmim);color:#fff;font-size:11px;text-align:center;padding:5px;letter-spacing:.2px}
.hdr{background:var(--petrol);color:#fff;padding:12px 16px 14px;border-radius:0 0 16px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hdr-top{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.92}
.backlink{background:rgba(255,255,255,.16);border:none;color:#fff;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;cursor:pointer}
.spacer{flex:1}
.page-title{font-size:22px;font-weight:700;margin:8px 0 2px;line-height:1.25;overflow-wrap:anywhere}
.page-sub{font-size:13px;opacity:.9;margin:0}
.body{padding:16px 16px 80px}
.note{background:#fff7e9;border:1px solid #f2dca6;color:#7a5b17;font-size:12.5px;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.fullbtn{width:100%;border:1px solid var(--petrol);background:#eef7f8;color:var(--petrol-d);font:inherit;font-size:13.5px;font-weight:700;padding:11px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.keys{background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:14px;padding:13px 15px;margin-bottom:18px}
.keys summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;color:var(--teal-ink);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.keys summary::-webkit-details-marker{display:none}
.keys .kchev{margin-left:auto;opacity:.7;transition:.2s}
.keys[open] .kchev{transform:rotate(180deg)}
.keys ul{list-style:none;margin:12px 0 2px;padding:0;display:flex;flex-direction:column;gap:10px}
.keys li{display:flex;gap:10px;font-size:13.5px;line-height:1.5;color:#173f34;text-align:justify}
.keys .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--petrol);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.sec-h{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;margin:8px 0 12px}
.sec-h.carmim{color:var(--carmim)}
.casebar{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.casebtn{flex:1;min-width:80px;border:1px solid var(--carmim-line);background:#fff;color:#9a3350;font:inherit;font-size:13px;font-weight:600;padding:10px 4px;border-radius:11px;cursor:pointer}
.casebtn.on{background:var(--carmim);color:#fff;border-color:var(--carmim)}
.casebox{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:8px}
.casebox.case-confirmado{border-color:#e0a9b3;background:linear-gradient(180deg,#fdeef1 0%,#f6cdd5 100%)}
.casebox.case-confirmado .casetag{background:var(--carmim);color:#fff}
.casebox.case-suspeito .casefig{background:#fff4e6}
.casebox.case-provavel .casefig{background:#fdede0}
/* S4-1: altura fixa para as figuras nao saltarem ao trocar de separador */
.casefig{line-height:0;background:#faf3ee;height:172px;display:flex;align-items:center;justify-content:center;padding:6px;box-sizing:border-box}
.case-media-grid{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;line-height:1.3}.case-media-grid>div{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;max-width:46%;flex:1}.case-media-grid img,.case-media-grid svg{max-height:128px!important}.case-media-grid span{font-size:11px;color:#333;text-align:center;margin-top:4px}
.casefig svg,.casefig img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.casetxt{padding:13px 15px;font-size:13.5px;line-height:1.65;color:#333;text-align:justify}
.casebox .casetxt{border-top:1px solid var(--line)}
.casetag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--carmim);background:var(--carmim-bg);padding:3px 9px;border-radius:20px;margin-bottom:8px}
.evonote{font-size:12px;color:#5f5f5f;line-height:1.55;margin:2px 2px 20px}
.evo{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px;background:#faf7f4}
.evo svg{display:block;width:100%;height:auto}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:13px 14px;font-size:14px;font-weight:600;overflow-wrap:break-word;min-width:0}
.acc>summary .ic{flex:none}
.acc>summary::-webkit-details-marker{display:none}
.acc .ic{color:var(--petrol);display:flex}
.acc .chev{margin-left:auto;color:#bbb;transition:.2s}
.acc[open] .chev{transform:rotate(180deg)}
.acc .inner{padding:6px 15px 14px;border-top:1px solid var(--line)}
.closer{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:9px 0;
 border:0;border-top:1px solid var(--line);background:none;cursor:pointer;
 color:var(--petrol);font:600 12.5px/1 inherit;font-family:inherit}
.closer:hover{background:#f2f7f9}
.secimg{margin:2px 0 12px}
.secimg img{width:100%;height:auto;display:block;border-radius:11px;border:1px solid var(--line)}
.secimg figcaption{font-size:11.5px;color:var(--muted);margin-top:5px;text-align:center}
.pager{display:flex;gap:10px;margin:18px 0 6px}
.pager a{flex:1 1 0;display:flex;align-items:center;gap:9px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
 background:#fff;text-decoration:none;color:inherit;min-width:0;overflow:hidden}
.pager a.nx{justify-content:flex-end;text-align:right}
.pager a:active{background:#f2f7f9}
.pager .tx{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.pager .lb{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pager .tt{display:block;font-size:13.5px;font-weight:700;color:var(--teal-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager svg{flex:none;width:18px;height:18px;stroke:var(--petrol);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pager .end{flex:1;padding:12px 13px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12.5px;display:flex;align-items:center;justify-content:center}
.closer svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mlist{margin:6px 0;padding-left:20px;font-size:13.3px;line-height:1.6;color:#3a3a3a;text-align:justify}
/* o texto do manual tem URLs longos: nunca deixar sair da caixa */
.mlist li,.casetxt,.riskrow .tx,.rtext,.keys li,.ft-h3,.subh{overflow-wrap:break-word;word-break:break-word}
.mlist li{margin:5px 0}
.mlist li.sub{list-style:circle;margin-left:14px;color:#555}
.mlist li.sub2{list-style:square;margin-left:30px;color:#666;font-size:12.9px}
.mlist b{color:var(--petrol-d)}
.riskitem{margin:14px 0}
.rbanner{border:1px solid #e7efec;border-radius:10px;overflow:hidden;background:#f7fbfa;margin-bottom:8px}
.rbanner svg,.rbanner img{display:block;width:100%;height:auto}
/* S4-10: o texto dos grupos de risco herdava 16px do body; alinhar com o resto (13.3px) */
.riskrow{display:flex;gap:12px;align-items:center;margin:12px 0}
.riskrow .tx{flex:1;min-width:0;font-size:13.3px;line-height:1.55;color:#3a3a3a;text-align:left}
.riskrow{--risk-media-size:108px}
.riskrow .ill{box-sizing:border-box;flex:none;width:var(--risk-media-size);height:var(--risk-media-size);padding:0;background:#f7fbfa;border:1px solid #e7efec;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.riskrow .ill svg,.riskrow .ill img{box-sizing:border-box;width:100%;height:100%;max-width:100%;max-height:100%;display:block;object-fit:contain;object-position:center}
.rtext{font-size:13px;line-height:1.55;color:#3a3a3a;text-align:justify}
.rtext b,.riskrow .tx b{color:var(--petrol-d)}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px;line-height:1.6}
.home-h{padding:22px 18px 8px}
.home-h h1{font-size:22px;font-weight:800;margin:0 0 4px;color:#fff}
.home-h p{margin:0;font-size:13px;opacity:.92;color:#fff}
.home-list{padding:12px 16px}
.grp-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--petrol);margin:16px 4px 8px}
.dcard{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.dcard:hover{border-color:var(--petrol)}
.dcard .lt{flex:none;width:40px;height:40px;border-radius:11px;background:var(--teal-bg);color:var(--petrol);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dcard .nm{font-size:14.5px;font-weight:700;color:var(--petrol-d)}
.dcard .ar{margin-left:auto;color:var(--petrol)}
.ft-h3{font-size:15px;font-weight:700;color:var(--petrol-d);margin:18px 0 4px;padding-bottom:5px;border-bottom:2px solid var(--teal-line)}
.edlab{display:block;font-size:12px;font-weight:700;color:var(--petrol-d);margin:14px 2px 5px}.edin,.edta{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:13px;color:#333}.edta{min-height:70px;resize:vertical;line-height:1.5}.logitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.logh{font-size:13.5px;font-weight:700;color:var(--petrol-d)}.logm{font-size:12px;color:var(--muted);margin-top:3px}.adminbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 6px;justify-content:center}.adminbtn{border:1px solid var(--petrol);background:#fff;color:var(--petrol-d);font:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:20px;cursor:pointer}.adminbtn.on{background:var(--petrol);color:#fff}.offline{font-size:11.5px;color:var(--teal-ink);display:flex;align-items:center;gap:6px;justify-content:center;margin:4px 0 4px}
  .cover{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#eaf3f5,#fff)}.cover .cimg{width:100%;height:auto;display:block;border-bottom:4px solid var(--carmim)}.cover .cbody{padding:20px 22px 30px;text-align:center}.cover .flag{font-size:11.5px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;font-weight:700;margin:14px 0 4px}.cover h1{font-size:23px;line-height:1.25;font-weight:800;color:var(--petrol-d);margin:6px 8px 8px}.cover .sub{font-size:13.5px;color:#444;margin:0 8px 14px;line-height:1.5}.cover .org{font-size:13px;font-weight:700;color:var(--petrol);margin:2px}.cover .place{font-size:12.5px;color:var(--muted);margin:2px 0 18px}.cbtn{display:inline-flex;align-items:center;gap:8px;background:var(--carmim);color:#fff;border:none;font:inherit;font-size:15px;font-weight:700;padding:13px 26px;border-radius:26px;cursor:pointer;box-shadow:0 4px 14px rgba(176,32,64,.28)}.subh{font-size:15px;font-weight:700;color:var(--petrol-d);margin:16px 0 6px}.secp{font-size:13.6px;line-height:1.7;color:#343434;margin:9px 0;text-align:justify}.mono{font-family:monospace;font-weight:700;color:var(--petrol)}.dcard .lt.sm{font-size:14px}
  .fab{position:fixed;bottom:20px;right:max(16px,calc(50% - 214px));z-index:20;background:var(--petrol);color:#fff;border:none;font:inherit;font-size:13px;font-weight:700;padding:11px 16px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.backlink{display:none!important}
.risk-water{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%}.risk-water img{max-width:100%;max-height:100%}.water-unavailable{position:absolute;right:0;bottom:0;border-radius:50%;background:white;color:#B02040;font:700 30px/1 Arial,sans-serif}

/* Ilustrações das fichas. */
.manual-figure{margin:0;width:100%}
.manual-figure img{display:block;width:100%;height:auto;max-height:none}
.casefig .manual-figure:not(.review-case-diagram) figcaption{display:block;margin:0;padding:10px 12px;font-size:12px;line-height:1.5;color:#52616a;text-align:justify;overflow-wrap:anywhere;background:#fff}
.casebox.case-illustrated .casefig{height:auto;min-height:172px;padding:0;background:#fff}
.casebox.case-illustrated .casefig .manual-figure img{width:100%;height:auto;max-height:none}

.mpox-epilink{padding:14px;box-sizing:border-box;color:#174b43;background:#fff}
.mpox-epiheading{padding:12px 10px;background:#eaf4ef;border-radius:10px;text-align:center;line-height:1.45}
.mpox-epiheading strong{display:block;font-size:18px;font-weight:700}
.mpox-epiheading span{display:block;font-size:14px;margin-top:4px}
.mpox-conditions{margin-top:14px}
.mpox-condition{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:14px;background:#fdfaf2;border:1px solid #e9e4d7;border-radius:12px;overflow:hidden;padding:8px}
.casebox.case-illustrated .casefig .mpox-condition img{width:100%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:8px}
.mpox-condition p{margin:0;font-size:15px;line-height:1.45;text-align:left;overflow-wrap:break-word}
.mpox-condition p strong{font-weight:700}
.mpox-condition p span{display:block;font-size:13px;line-height:1.45;margin-top:5px;color:#43564e}
.mpox-or{width:32px;margin:4px auto;text-align:center;font-size:12px;line-height:24px;font-weight:700;color:#174b43;background:#eaf4ef;border-radius:20px}
@media(max-width:360px){.mpox-epilink{padding:10px}.mpox-condition{grid-template-columns:76px minmax(0,1fr);gap:10px}.mpox-epiheading strong{font-size:17px}}

/* A mesma área visual para ícones e ilustrações de todos os grupos. */
@media(max-width:360px){.riskrow{--risk-media-size:88px;gap:10px}}

.review-case-diagram{padding:14px;box-sizing:border-box;color:#174b43}
.review-case-diagram figcaption{font-size:17px;font-weight:700;line-height:1.45;text-align:center;background:#eaf4ef;padding:12px 8px;border-radius:10px}
.review-case-rows{padding-top:12px}
.review-case-row{display:flex;gap:14px;align-items:center;padding:10px;background:#f9fbf9;border:1px solid #dde8e2;border-radius:10px}
.casebox.case-illustrated .casefig .review-case-row img{flex:none;width:90px;height:90px;object-fit:contain;border-radius:8px}
.review-case-row p{margin:0;min-width:0;font-size:14px;line-height:1.5;text-align:left;overflow-wrap:break-word}
.review-case-connector{font-size:12px;line-height:24px;text-align:center;font-weight:700;min-height:8px}
@media(max-width:360px){.review-case-diagram{padding:10px}.review-case-row{gap:9px;padding:8px}.casebox.case-illustrated .casefig .review-case-row img{width:68px;height:68px}}

/* Ilustrações dos grupos de risco: tamanho compacto, sem cortes. */
.rbanner img[src$="mpox-contacto-escola-saude.png"],
.rbanner img[src$="parotidite-escola-quartel.png"],
.rbanner img[src$="rubeola-viagens-internacionais.png"],
.rbanner img[src$="risco-imunocomprometidos.png"],
.rbanner img[src$="polio-criancas-vacinacao.png"],
.rbanner img[src$="polio-comunidade-saneamento.png"]{width:auto;max-width:100%;height:auto;max-height:150px;object-fit:contain;margin:8px auto;}


/* Mesmas imagens dos suspeitos, maiores, sem corte ou deformação. */
.casebox.case-suspeito.case-size-large .casefig{height:auto;min-height:172px;padding:0;background:#fff}
.casebox.case-suspeito.case-size-large .casefig>img,
.casebox.case-suspeito.case-size-large .casefig>.manual-figure:not(.review-case-diagram) img{width:100%;height:auto;max-height:none;object-fit:contain}
.casebox.case-suspeito.case-size-large .review-case-row{flex-direction:column;gap:12px;padding:12px}
.casebox.case-suspeito.case-size-large .casefig .review-case-row img{width:min(180px,100%);height:auto;max-height:none;object-fit:contain}
.casebox.case-suspeito.case-size-large .review-case-row p{width:100%;text-align:left}


/* Composições antigas com vários sinais: mesmas imagens, tamanho maior. */
.casebox.case-suspeito.case-size-large .case-media-grid{display:flex;flex-direction:column;height:auto;gap:10px;padding:10px;box-sizing:border-box}
.casebox.case-suspeito.case-size-large .case-media-grid>div{height:auto;max-width:100%;width:100%;flex:none}
.casebox.case-suspeito.case-size-large .case-media-grid img,
.casebox.case-suspeito.case-size-large .case-media-grid svg{width:min(180px,100%);height:auto;max-height:none!important;object-fit:contain}
.casebox.case-suspeito.case-size-large .case-media-grid span{font-size:13px;line-height:1.4;margin-top:8px}

.case-heading{padding:10px 14px;border-bottom:1px solid var(--line);background:#fff}
.case-heading .casetag{margin:0}
.riskitem{margin:12px 0 16px}
.riskitem .riskrow{margin:0}
.risk-credit{margin-top:7px}
.photo-credit,.casefig .manual-figure:not(.review-case-diagram) figcaption.photo-credit{display:block;margin:0;padding:8px 12px;font:400 12px/1.6 'Raleway',Arial,sans-serif;color:#52616a;background:#fff;text-align:justify;overflow-wrap:break-word;word-break:normal}
.risk-credit .photo-credit{padding:0;background:transparent}
.photo-caption-text{display:block;color:#3c4c54}
.photo-source{display:block;margin-top:3px;font-size:11.5px;line-height:1.6}
.photo-source a{color:#00566a;text-decoration:underline;overflow-wrap:anywhere}
.riskrow .tx,.rtext,.mpox-condition p,.review-case-row p,.casebox.case-suspeito.case-size-large .review-case-row p,.secimg figcaption,.media-credit,.evonote{text-align:justify}
.secimg figcaption{line-height:1.6;overflow-wrap:break-word}
.casefig .photo-credit{width:100%}

.casebox:not(.case-suspeito) .real-photo img{max-height:260px!important;width:100%!important;object-fit:contain}
.casefig .real-photo{width:100%;margin:0}

.review-case-diagram .review-case-title{font-size:17px;font-weight:700;line-height:1.45;text-align:center;background:#eaf4ef;padding:12px 8px;border-radius:10px;margin-bottom:10px}
.lepto-photo{margin:0}.review-case-diagram .lepto-photo figcaption.photo-credit{font:400 12px/1.6 'Raleway',Arial,sans-serif;text-align:justify;background:#fff;padding:8px 0;color:#52616a;border-radius:0}

.disease-hero{margin:0 0 20px;border:1px solid #dce5e7;border-radius:12px;overflow:hidden;background:#fff}
.disease-hero figure{margin:0}.disease-hero img{display:block;width:100%;height:auto;max-height:480px;object-fit:contain;margin:auto}
.disease-hero figcaption{padding:12px;font-size:12px;line-height:1.5;color:#52616a;overflow-wrap:anywhere}
.disease-hero a{color:#00566a}.disease-hero .photo-source{display:block}
@media(max-width:600px){.disease-hero img{max-height:360px}}
</style></head>

/* Negrito nos rotulos do manual. Tambem quando o rotulo esta sozinho
   (o conteudo dele esta nos sub-bullets) -- o manual poe-os a negrito na mesma. */
function boldLabel(t){var m=t.match(/^([^:]{2,46}):\s*([\s\S]*)$/);
 if(m) return m[2] ? '<b>'+m[1]+':</b> '+m[2] : '<b>'+m[1]+':</b>';
 return t;}
/* Navegacao continua: seguir a ordem do manual sem ter de voltar a lista. */
function ordemManual(){ var o=[]; for(var k in DISEASES) o.push(k); return o; }

function addClosers(){
  [].slice.call(document.querySelectorAll('details.acc > .inner, details.keys > ul')).forEach(function(inn){
    if(inn.querySelector('.closer')) return;
    var b=document.createElement('button');
    b.type='button'; b.className='closer';
    b.innerHTML='<svg viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M18 15l-6-6-6 6"/></svg> Fechar';
    b.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      var d=inn.parentNode; d.open=false;
      var y=d.getBoundingClientRect().top+window.pageYOffset-10;
      window.scrollTo({top:y<0?0:y,behavior:'smooth'});

function sourceOnly(container){
 container.querySelectorAll('.photo-caption-text,.image-date').forEach(function(n){n.remove();});
 container.querySelectorAll('figcaption,.risk-credit,.media-credit').forEach(function(n){
  if(!/Fonte\s*:/i.test(n.textContent))return;
  var walker=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),t,found=null,offset=0;
  while(t=walker.nextNode()){var m=/Fonte\s*:/i.exec(t.nodeValue);if(m){found=t;offset=m.index;break;}}
  if(found){var range=document.createRange();range.setStart(n,0);range.setEnd(found,offset);range.deleteContents();}
 });
}

/* O texto integral usa os mesmos blocos actualizados pelo CMS. Preserva títulos e secções sem correspondência. */
function integralItems(d){
 var aliases={'Limiar de notificação e surto':'Número de casos necessários para desencadear a notificação e a investigação','Laboratório e amostras':'Colheita e manuseio de amostras para o diagnóstico laboratorial'};
 var out=[], a=d.full||[];
 for(var i=0;i<a.length;){var it=a[i];if(it[0]!=='h'){out.push(it);i++;continue;}
  var j=i+1;while(j<a.length&&a[j][0]!=='h')j++;
  var sec=secByTitle(d,aliases[it[1]]||it[1]);out.push(it);
  if(sec&&sec.items&&sec.items.length)sec.items.forEach(function(x){out.push([x[0],x[1]]);});else for(var n=i+1;n<j;n++)out.push(a[n]);i=j;
 }return out;
}
function renderFull(slug){var d=DISEASES[slug];var body='',cur=[];function flush(){if(cur.length){body+=renderItems(cur);cur=[];}}integralItems(d).forEach(function(it){if(it[0]==='h'){flush();body+='<div class="ft-h3">'+it[1]+'</div>';}else cur.push([it[0],it[1]]);});flush();
 document.getElementById('app').innerHTML='<header class="hdr"><div class="hdr-top"><button class="backlink" onclick="renderDisease(\''+slug+'\')"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Ficha</button><span>Texto integral</span><span class="spacer"></span></div><h1 class="page-title">'+d.name+'</h1><p class="page-sub">Texto integral do Manual</p></header><main class="body">'+body+pagerHTML(slug)+'<p class="foot">INS · MISAU</p></main>'+fab("renderDisease('"+slug+"')");window.scrollTo(0,0);}
/* Revisão de Germano, 24/09: nos esquemas que JÁ identificam PCR como método,
   mostrar PCR+ dentro da caixa e Confirmado por baixo, em carmim.
   Preservar o rodapé e não atribuir PCR a cultura, serologia ou outros critérios. */
var IMAGE_CREDITS={};
function captionEscape(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function captionHTML(media,fallback){
 var template=document.createElement('template');template.innerHTML=media||'';
 var images=Array.from(template.content.querySelectorAll('img')).filter(function(im){return /^assets\/(ilustracoes|fig)\//.test(im.getAttribute('src')||'');});
 if(!images.length)return '';
 var already=!!template.content.querySelector('figcaption, .review-case-row p, .case-media-grid span');
 var titles=[],sources=[];
 images.forEach(function(im){var path=im.getAttribute('src'),alt=(im.getAttribute('alt')||'').trim();if(alt&&!/\.(jpg|jpeg|png|webp|svg)$/i.test(alt)&&titles.indexOf(alt)<0)titles.push(alt);var credit=IMAGE_CREDITS[path];if(credit&&sources.indexOf(credit)<0)sources.push(credit);});
 var title=already?'':(titles.length===1&&titles[0].length<=90?titles[0]:(fallback||''));
 if(!title&&!sources.length)return '';
 return '<div class="media-credit" style="font:11.5px/1.5 Raleway,Arial,sans-serif;color:#52616a;padding:8px 12px;text-align:justify;overflow-wrap:anywhere">'+(title?'<div>'+captionEscape(title)+'</div>':'')+(sources.length?'<div style="margin-top:3px;font-size:10.5px">Fonte: '+captionEscape(sources.join('; '))+'</div>':'')+'</div>';
}

function formatConfirmedMedia(c){
 var m=c.media||'';
 /* Parotidite: IgM e PCR permanecem alternativas no texto clínico. */
 if(m.indexOf('Detecção de anticorpos IgM ou RNA por PCR')>=0 && /confirmad/i.test(c.label)){
  var start=m.indexOf('<rect x="272" y="42"'),end=m.indexOf('<text x="180" y="156"',start);
  if(start>=0 && end>start) return m.slice(0,start)+
   '<rect x="272" y="42" width="60" height="48" rx="8" fill="#fff4f5" stroke="#B02040" stroke-width="1.8"/>'+
   '<text x="302" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#B02040">IgM+ ou</text>'+
   '<text x="302" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#B02040">PCR+</text>'+
   '<text x="302" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#B02040">Confirmado</text>'+m.slice(end);
 }
 /* Germano, 28/09: filaríase confirmada por imunocromatografia (ICT+). */
 if(/confirmad/i.test(c.label) && m.indexOf('Confirmação laboratorial — serologia')>=0 &&
    m.indexOf('>Serologia</text>')>=0 && m.indexOf('>Resultado positivo</text>')>=0){
  var start=m.indexOf('<rect x="272" y="44"'),end=m.indexOf('<text x="180" y="156"',start);
  if(start>=0 && end>start) return m.slice(0,start)+
   '<rect x="272" y="44" width="60" height="46" rx="8" fill="#fff4f5" stroke="#B02040" stroke-width="1.8"/>'+
   '<text x="302" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#B02040">ICT+</text>'+
   '<text x="302" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#B02040">Confirmado</text>'+m.slice(end);
 }
 if(!/confirmad/i.test(c.label)||m.indexOf('Confirmação laboratorial — PCR')<0||m.indexOf('Resultado positivo')<0)return m;
 var start=m.indexOf('<rect x="272" y="44"'),end=m.indexOf('<text x="180" y="156"',start);
 if(start<0||end<0)return m;
 return m.slice(0,start)+
  '<rect x="272" y="44" width="60" height="46" rx="8" fill="#fff4f5" stroke="#B02040" stroke-width="1.8"/>'+
  '<text x="302" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#B02040">PCR+</text>'+
  '<text x="302" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#B02040">Confirmado</text>'+
  m.slice(end);
}
function setCase(slug,i,btn){

/* Progresso de leitura local, separado entre cópia de teste e manual real. */
(function(){
 function initReading(){
  var file=location.pathname.split('/').pop()||'index.html';
  var allowed=['manual.html','seccao.html','sindrome.html','doenca.html'];
  var scope=location.pathname.slice(0,location.pathname.lastIndexOf('/')+1),key='ins-reading-v1:'+scope;
  var store;try{store=window.localStorage;}catch(e){return;}
  if(!store)return;
  function load(){try{return JSON.parse(store.getItem(key)||'null');}catch(e){return null;}}
  function readingLabel(s){return String(s||'Manual').replace(/\s+/g,' ').trim().replace(/^(SECÇÃO\s+\d+)\s*[—–-]?\s*/i,'$1 — ');}
  var saved=load(),url=file+location.search,last=saved&&saved.last;
  function valid(v){return v&&typeof v.url==='string'&&/^(manual|seccao|sindrome|doenca)\.html(?:\?[^#]*)?$/.test(v.url)&&!/[<>\\]/.test(v.url);}
  if(allowed.indexOf(file)<0){
   if((file==='index.html'||file==='')&&valid(last)){
    var main=document.querySelector('main')||document.querySelector('.body');if(!main)return;
    var box=document.createElement('div');box.style.cssText='margin:12px 0;padding:14px;border:1px solid #a9e0cd;border-radius:12px;background:#e3f4ef';
    var text=document.createElement('p');text.textContent='Continuar a leitura: '+readingLabel(last.label);text.style.margin='0 0 10px';
    var link=document.createElement('a');link.href=last.url+'#retomar';link.textContent='Retomar leitura';link.className='pill';box.appendChild(text);box.appendChild(link);main.insertBefore(box,main.firstChild);
   }return;
  }
  var nav=window.performance&&typeof window.performance.getEntriesByType==='function'?window.performance.getEntriesByType('navigation')[0]:null;
  var resume=location.hash==='#retomar'||!!(nav&&(nav.type==='reload'||nav.type==='back_forward'));
  var prior=saved&&saved.pages&&saved.pages[url],restoring=!!valid(prior)&&(file!=='doenca.html'||resume),moved=false,timer;
  // Uma nova abertura de ficha começa na imagem; retomar/recarregar preserva a leitura.
  if(file==='doenca.html'&&!resume&&'scrollRestoration' in history)history.scrollRestoration='manual';
  function snapshot(){
   if(restoring)return;
   var data=load()||{},sub=document.querySelector('.page-sub'),tag=document.querySelector('.casebtn.on');
   var v={url:url,label:readingLabel((document.querySelector('.page-title')||{}).textContent||document.title),y:Math.max(0,window.scrollY||0),open:Array.from(document.querySelectorAll('details')).map(d=>d.open),full:!!(sub&&/texto integral/i.test(sub.textContent)),caseIndex:tag?Array.from(document.querySelectorAll('.casebtn')).indexOf(tag):-1};
   data.pages=data.pages||{};data.pages[url]=v;data.last=v;data.updated=Date.now();
   var ks=Object.keys(data.pages);if(ks.length>80)delete data.pages[ks[0]];
   try{store.setItem(key,JSON.stringify(data));}catch(e){}
  }
  function stop(){moved=true;restoring=false;}
  ['wheel','touchstart','keydown'].forEach(n=>window.addEventListener(n,stop,{passive:true,once:true}));
  if(restoring){
   if(file==='doenca.html'&&prior.full&&typeof window.renderFull==='function')window.renderFull(window.resolveSlug(window.slugFromURL()));
   else if(file==='doenca.html'&&prior.caseIndex>=0){var b=document.querySelectorAll('.casebtn')[prior.caseIndex];if(b)b.click();}
   Array.from(document.querySelectorAll('details')).forEach((d,i)=>{if(prior.open&&typeof prior.open[i]==='boolean')d.open=prior.open[i];});
   [0,150,500,1100].forEach((ms,i)=>setTimeout(function(){if(!moved)window.scrollTo(0,Number.isFinite(prior.y)?Math.max(0,prior.y):0);if(i===3){restoring=false;snapshot();}},ms));
  }else snapshot();
  window.addEventListener('scroll',function(){clearTimeout(timer);timer=setTimeout(snapshot,200);},{passive:true});
  document.addEventListener('toggle',function(){if(!restoring)snapshot();},true);
  window.addEventListener('pagehide',snapshot);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')snapshot();});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initReading);else initReading();
})();

</script>
