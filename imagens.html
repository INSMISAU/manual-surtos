<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f5b78"><title>Imagens — Manual de Surtos</title><style>body{margin:0;background:#eef2f5;color:#23343e;font:16px/1.5 Arial,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{color:#0f5b78;font-size:28px}a{color:#0f5b78}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #9bb8c5;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}.image-card{margin:0;background:white;border-radius:12px;overflow:hidden;border:1px solid #dbe5ea}.image-card>img,.diagram{display:block;width:100%;height:250px;object-fit:contain;background:#f8fafb}.diagram{display:flex;align-items:center;justify-content:center}.diagram svg{max-width:100%;max-height:100%}figcaption{padding:15px;overflow-wrap:anywhere}figcaption p{font-size:14px;margin:9px 0}.source{color:#52616a}[hidden]{display:none!important}footer{margin:24px 0}@media print{input,.back{display:none}.image-card{break-inside:avoid}}.diagram-html{display:block;box-sizing:border-box;height:auto;min-height:250px;padding:12px;font-size:14px;line-height:1.5}.diagram-html .manual-figure{margin:0}.diagram-html figcaption{font-size:16px;color:#174b43;background:#eaf4ef;border-radius:8px;text-align:center;padding:10px}.diagram-html p{margin:8px 0}.diagram-html .review-case-row{padding:10px;border:1px solid #d5e5df;border-radius:8px}.diagram-html .review-case-connector{text-align:center;font-size:12px;font-weight:bold;padding:5px}figcaption p,.source{text-align:justify;line-height:1.6}.grid{gap:14px}.photo-caption-text,.photo-source{display:block}.photo-source{margin-top:4px;font-size:12px;color:#52616a}</style></head><body><main><a class="back" href="index.html">← Voltar ao manual</a><h1>Ver todas as imagens</h1><label for="image-filter">Localizar imagem, doença ou figura</label><input id="image-filter" type="search" autocomplete="off" aria-controls="image-grid"><p id="image-count" role="status" aria-live="polite"></p><div id="image-grid" class="grid"></div><p id="image-empty" hidden>Não foram encontradas imagens. Experimente outra palavra.</p><footer><a href="index.html">Voltar ao manual</a></footer></main><script src="ddata.js"></script><script src="assets/js/content.js"></script><script src="assets/js/galeria.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});</script></body></html>
